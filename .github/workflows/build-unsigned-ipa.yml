name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  build:
    runs-on: macos-15
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.ci/DerivedData
      CLONED_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci/SourcePackages
      SHERPA_ONNX_VERSION: v1.12.29
      SENSEVOICE_CPP_REF: 6503f51c2357034e1443c86dabeb24ad026c4b45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore Xcode package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}
            ${{ env.CLONED_SOURCE_PACKAGES_PATH }}
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-packages-${{ hashFiles('EarPal.xcodeproj/project.pbxproj', 'Podfile', 'Podfile.lock', 'EarPal.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.github/workflows/build-unsigned-ipa.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-packages-

      - name: Inspect Apple toolchain
        id: toolchain
        run: |
          echo "xcode_version=$(xcodebuild -version | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"
          echo "iphoneos_sdk=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - name: Install CocoaPods
        run: |
          gem list cocoapods -i || sudo gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Restore SherpaOnnx runtime cache
        id: cache-sherpa-onnx
        uses: actions/cache@v4
        with:
          path: Vendor/SherpaOnnx/build-ios-no-tts
          key: ${{ runner.os }}-sherpa-onnx-${{ env.SHERPA_ONNX_VERSION }}-${{ hashFiles('.github/workflows/build-unsigned-ipa.yml') }}

      - name: Download SherpaOnnx iOS runtime
        if: steps.cache-sherpa-onnx.outputs.cache-hit != 'true'
        run: |
          mkdir -p Vendor/SherpaOnnx
          curl -L \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}-ios-no-tts.tar.bz2 \
            -o "$RUNNER_TEMP/sherpa-onnx-ios-no-tts.tar.bz2"
          tar -xjf "$RUNNER_TEMP/sherpa-onnx-ios-no-tts.tar.bz2" -C Vendor/SherpaOnnx

      - name: Restore SenseVoice ggml XCFramework cache
        id: cache-sensevoice-ggml
        uses: actions/cache@v4
        with:
          path: Vendor/SenseVoiceGGML/output/SenseVoiceGGML.xcframework
          key: ${{ runner.os }}-sensevoice-ggml-xcframework-xcode${{ steps.toolchain.outputs.xcode_version }}-sdk${{ steps.toolchain.outputs.iphoneos_sdk }}-ref${{ env.SENSEVOICE_CPP_REF }}-${{ hashFiles('scripts/build-sensevoice-ggml-ios.sh', 'Native/SenseVoiceGGMLBridge.mm', 'EarPal/SenseVoiceGGMLBridge.h') }}

      - name: Build SenseVoice ggml iOS runtime
        if: steps.cache-sensevoice-ggml.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-sensevoice-ggml-ios.sh

      - name: Build app for device
        run: |
          mkdir -p "$DERIVED_DATA_PATH" "$CLONED_SOURCE_PACKAGES_PATH"
          xcodebuild \
            -workspace EarPal.xcworkspace \
            -scheme EarPal \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT="$RUNNER_TEMP/build"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/build" -path "*Release-iphoneos/EarPal.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Built app not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/EarPal.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry EarPal-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EarPal-unsigned-ipa
          path: ${{ runner.temp }}/EarPal-unsigned.ipa
