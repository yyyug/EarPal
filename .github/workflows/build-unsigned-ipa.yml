name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  build:
    runs-on: macos-15
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.ci/DerivedData
      CLONED_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci/SourcePackages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore Xcode package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}
            ${{ env.CLONED_SOURCE_PACKAGES_PATH }}
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-packages-${{ hashFiles('EarPal.xcodeproj/project.pbxproj', 'Podfile', 'Podfile.lock', 'EarPal.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.github/workflows/build-unsigned-ipa.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-packages-

      - name: Install CocoaPods
        run: |
          gem list cocoapods -i || sudo gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Download SherpaOnnx iOS runtime
        run: |
          mkdir -p Vendor/SherpaOnnx
          curl -L \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.29/sherpa-onnx-v1.12.29-ios-no-tts.tar.bz2 \
            -o "$RUNNER_TEMP/sherpa-onnx-ios-no-tts.tar.bz2"
          tar -xjf "$RUNNER_TEMP/sherpa-onnx-ios-no-tts.tar.bz2" -C Vendor/SherpaOnnx

      - name: Build app for device
        run: |
          mkdir -p "$DERIVED_DATA_PATH" "$CLONED_SOURCE_PACKAGES_PATH"
          xcodebuild \
            -workspace EarPal.xcworkspace \
            -scheme EarPal \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT="$RUNNER_TEMP/build"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/build" -path "*Release-iphoneos/EarPal.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Built app not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/EarPal.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry EarPal-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EarPal-unsigned-ipa
          path: ${{ runner.temp }}/EarPal-unsigned.ipa
