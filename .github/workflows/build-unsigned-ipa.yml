name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app for device
        run: |
          xcodebuild \
            -project EarPal.xcodeproj \
            -scheme EarPal \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT="$RUNNER_TEMP/build"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/build" -path "*Release-iphoneos/EarPal.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Built app not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/EarPal.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry EarPal-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EarPal-unsigned-ipa
          path: ${{ runner.temp }}/EarPal-unsigned.ipa
